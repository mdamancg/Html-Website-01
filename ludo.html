
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Board</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
        }

        .board {
            width: 830px;
            height: 830px;
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            border: 1px solid black;
        }

        /* Four home areas */

        .home {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .red {
            background-color: red;
            grid-column: 1 / 7;
            grid-row: 1 / 7;
        }

        .green {
            background-color: green;
            grid-column: 10 / 16;
            grid-row: 1 / 7;
        }

        .blue {
            background-color: blue;
            grid-column: 1 / 7;
            grid-row: 10 / 16;
        }

        .yellow {
            background-color: yellow;
            grid-column: 10 / 16;
            grid-row: 10 / 16;
        }

        /* White home boxes */

        .inner {
            width: 70%;
            height: 70%;
            background-color: white;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            justify-items: center;
            align-items: center;
            padding: 20px;
            gap: 15px;
        }

        /* Tokens */

        .token {
            width: 55px;
            height: 55px;
            border: 6px solid;
            border-radius: 50%;
        }

        .red-token {
            border-color: red;
        }

        .green-token {
            border-color: green;
        }

        .blue-token {
            border-color: blue;
        }

        .yellow-token {
            border-color: yellow;
        }

        /* Track cells */

        .track {
            display: grid;
        }

        .vertical {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(6, 1fr);
        }

        .horizontal {
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(3, 1fr);
        }

        .cell {
            border: 1px solid black;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }

        .green-path {
            background-color: green;
        }

        .red-path {
            background-color: red;
        }

        .blue-path {
            background-color: blue;
        }

        .yellow-path {
            background-color: yellow;
        }

        /* Track positions */

        .top-track {
            grid-column: 7 / 10;
            grid-row: 1 / 7;
        }

        .bottom-track {
            grid-column: 7 / 10;
            grid-row: 10 / 16;
        }

        .left-track {
            grid-column: 1 / 7;
            grid-row: 7 / 10;
        }

        .right-track {
            grid-column: 10 / 16;
            grid-row: 7 / 10;
        }

        /* Centre */

        .center {
            grid-column: 7 / 10;
            grid-row: 7 / 10;
            background: conic-gradient(
                green 0deg 90deg,
                yellow 90deg 180deg,
                blue 180deg 270deg,
                red 270deg 360deg
            );
            border: 1px solid black;
        }

        /* Responsive */

        @media (max-width: 850px) {
            .board {
                width: 95vw;
                height: 95vw;
            }

            .token {
                width: 65%;
                height: 65%;
                border-width: 4px;
            }

            .inner {
                padding: 8px;
                gap: 8px;
            }

            .cell {
                font-size: 4vw;
            }
        }

    </style>
</head>

<body>

    <div class="board">
        <div class="home red">
            <div class="inner">
                <div class="token red-token"></div>
                <div class="token red-token"></div>
                <div class="token red-token"></div>
                <div class="token red-token"></div>
            </div>
        </div>
        <div class="home green">

                <div class="token green-token"></div>

                <div class="token green-token"></div>
                <div class="token green-token"></div>
            </div>
        </div>
        <div class="home blue">

            <div class="cell"></div>

            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell green-path"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell green-path"></div>
            <div class="cell"></div>
        </div>
        <div class="track vertical bottom-track">
            <div class="cell"></div>
            <div class="cell blue-path"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell blue-path"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell blue-path"></div>
            <div class="cell blue-path">★</div>

            <div class="cell blue-path">★</div>
            <div class="cell blue-path"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell blue-path"></div>
            <div class="cell"></div>

            <div class="cell"></div>

        <!-- Red Track -->
        <div class="track horizontal left-track">

            <div class="cell"></div>

            <div class="cell red-path"></div>
            <div class="cell red-path"></div>
            <div class="cell red-path"></div>
            <div class="cell red-path"></div>

            <div class="cell"></div>

        <!-- Yellow Track -->

            <div class="cell"></div>

            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell yellow-path">★</div>
            <div class="cell"></div>
        </div>
        <div class="center"></div>

    </div>

</body>
</html>
