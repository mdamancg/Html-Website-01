<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            gap: 35px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .box {
            text-align: center;
        }

        h2 {
            font-size: 23px;
            font-weight: normal;
            letter-spacing: 3px;
            margin-bottom: 18px;
        }

        table {
            border-collapse: collapse;
        }

        td {
            width: 33px;
            height: 33px;
            border: 1px solid black;
            text-align: center;
            font-size: 23px;
        }

        /* Green background */
        .green {
            background-color: #a8d6bb;
        }

        /* Thick borders after every 3 cells */
        td:nth-child(3n) {
            border-right: 2px solid black;
        }

        tr:nth-child(3n) td {
            border-bottom: 2px solid black;
        }

        /* Outer border */
        table {
            border: 2px solid black;
        }
    </style>
</head>
