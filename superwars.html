
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Wars</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            font-family: Georgia, serif;
        }

        .container {
            width: 93%;
            min-height: 690px;
            margin: 47px auto;
            background-color: white;
            display: grid;
            grid-template-columns: 1fr 200px 1fr;
            align-items: start;
            padding-top: 6px;
        }

        .team {
            display: flex;
            justify-content: center;
            gap: 18px;
        }

        .card {
            width: 135px;
            height: 230px;
            border: 2px solid #ddd;
            border-radius: 9px;
            box-shadow: 0 0 3px gray;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 17px 5px;
            text-align: center;
        }

        .card img {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }

        .name {
            font-size: 16px;
            margin-top: 4px;
            line-height: 18px;
        }

        .score {
            font-size: 45px;
            margin-top: 4px;
        }

        .result {
            font-size: 45px;
            text-align: center;
            padding-top: 3px;
        }

        @media (max-width: 750px) {
            .container {
                grid-template-columns: 1fr;
                gap: 30px;
                padding: 20px;
            }

            .result {
                grid-row: 1;
            }

            .team {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="team">

            <div class="card">
                <img src="super-1.png" alt="Spiderman">
                <p class="name">Spiderman</p>
                <p class="score">12</p>
            </div>

            <div class="card">
                <img src="super-3.png" alt="Wonder Women">
                <p class="name">Wonder<br>Women</p>
                <p class="score">30</p>
            </div>

        </div>
        <div class="result">
            5 - 0
        </div>

        <div class="team">

            <div class="card">
                <img src="super-2.png" alt="Captain America">
                <p class="name">Captain<br>America</p>
                <p class="score">50</p>
            </div>

            <div class="card">
                <img src="super-4.png" alt="Gem Woman">
                <p class="name">Gem Woman</p>
                <p class="score">12</p>
            </div>

        </div>

    </div>

</body>
</html>
