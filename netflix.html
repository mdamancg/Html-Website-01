<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main {
            background-image: url(Title-Image.png);
            background-size: cover;
            background-repeat: no-repeat;
            height: 100vh;
            width: 100%;
        }
        .main nav {
            display: flex;
            justify-content: space-between;
            align-items: first baseline;
            padding: 20px;
            height: 50vh;

        }
        .main nav div {
            display: flex;
            height: 40px;
            gap: 20px;

        }
        .main ul {
            display: flex;
            list-style-type: none;
            gap: 20px;
            color: black;
            font-weight: 100px;
        }
        nav>div+div img {
            width: 25px;
            height: 25px;

        }
        .show {
            display: flex;
            flex-direction: column;
            margin: 20px;
            padding-left: 30px;
            margin-top: -30px;
        }
        .show img {
            height: 30px;
            width: 20px;
        }
        .show+div {
            justify-content: center;
            align-items: center;
        }
        .show>div+div {
            font-size: 100px;
            font-weight: bold;
            color: white;
        }
        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            border-radius: 5px;
            padding: 5px 10px;
            font-weight: bold;
        }
        .bth2 {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            border-radius: 5px;
            background-color: #A6AFB2;
            padding: 5px 10px;
            font-weight: bold;
            color: white;
        }
        .button img {
            width: 20px;
            height: 20px;
        }
        .button {
            display: flex;
            gap: 10px;
        }
        .nshow {
            gap: 10px;
            display: flex;
            align-items: center;
            color: white;
            letter-spacing: 3px;

        }
        body {
            background-color: #141414;
        }
        .Watchmovie {
            padding: 20px 30px;
        }
         .see {
            color: white;
            display: flex;
            align-items: center;
            font-weight: bolder;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .see img {
            width: 20px;
            height: 10px;
        }

        .picture {
            display: flex;
            gap: 3%;
        }

        .picture img {
            width: 18%;
        }

        .top10 {
            margin-top: 60px;
            padding: 20px 30px;
        }
        .pictureone{
            display: flex;
            gap: 30px;
        }
        .pictureone div{
            display: flex;
        }
        .pictureone div img{
            width: 70%;
            height: 150px;
        }
    </style>
</head>

<body>
    <div class="main">
        <nav>
            <div>
                <img src="NetflixLogoSvg.png">
                <ul>
                    <li>Start</li>
                    <li>Shows</li>
                    <li>Movies</li>
                    <li>New</li>
                    <li>My List</li>
                </ul>
            </div>
            <div>
                <img src="Search.png">
                <img src="GiftBox.png">
                <img src="NotificationBell.png">
                <img src="ProfileIMG.png">
                <img src="DownArrow.png">
            </div>
        </nav>
        <div class="show">
            <div class="nshow"><img src="Netflix_Symbol_RGB 1.png">SHOW</div>
            <div>MAID</div>
            <div class="button">
                <button class="btn"><img src="Play.png">Play</button>
                <button class="bth2"><img src="Detail.png">More Info </button>
            </div>


        </div>
        <div class="Watchmovie">
            <div class="see">See again<img src="ArrowRight.png"></div>
            <div class="picture">
                <img src="section 1.1.png">
                <img src="section 1.2.png">
                <img src="section 1.3.png">
                <img src="section 1.4.png">
                <img src="section 1.5.png">
            </div>


        </div>

    </div>
    <div class="top10">
        <div class="see">Top 10 Story In Our Country<img src="ArrowRight.png"></div>
        <div class="pictureone">
            <div>
            <img src="Rank - 01.png">
            <img src="section 2.1.png">
            </div>
            <div>
                <img src="Rank - 02.png">
                <img src="section 2.2.png"></div>
                <div><img src="Rank - 03.png">
                    <img src="section 2.3.png">
                </div>
                <div>
                    <img src="Rank - 04.png">
                    <img src="section 2.4.png">
                </div>
                <div>
                    <img src="Rank - 05.png">
                    <img src="section 2.5.png">
                </div>
            </div>


    </div>
    <div class="Watchmovie">
            <div class="see">Trending Now<img src="ArrowRight.png"></div>
            <div class="picture">
                <img src="section 3.1.png">
                <img src="section 3.2.png">
                <img src="section 3.3.png">
                <img src="section 3.4.png">
                <img src="section 3.5.png">
            </div>


        </div>

        <div class="Watchmovie">
            <div class="see">Sci-fi shows<img src="ArrowRight.png"></div>
            <div class="picture">
                <img src="section 4.1.png">
                <img src="section 4.2.png">
                <img src="section 4.3.png">
                <img src="section 4.4.png">
                <img src="section 4.5.png">
            </div>


        </div>
        <div >
            <img src="footer.png" alt="">
        </div>
    </div>
</body>

</html>
